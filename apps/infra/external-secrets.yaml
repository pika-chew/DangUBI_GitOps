apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dangubi-external-secrets
  namespace: argocd
  annotations:
    # 플랫폼 네임스페이스 다음, ExternalSecret을 사용하는 앱보다 먼저 등록한다.
    argocd.argoproj.io/sync-wave: "-15"
spec:
  project: dangubi-infra
  sources:
    - repoURL: https://charts.external-secrets.io
      chart: external-secrets
      targetRevision: 2.14.0
      helm:
        releaseName: dangubi-external-secrets
        valueFiles:
          - $values/helm/external-secrets/values.yaml
    - repoURL: https://github.com/pika-chew/DangUBI_GitOps.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      # 큰 CRD가 클라이언트 측 annotation 크기 제한을 넘지 않도록 적용한다.
      - ServerSideApply=true
