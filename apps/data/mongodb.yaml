apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dangubi-mongodb
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: dangubi-data
  source:
    repoURL: https://github.com/pika-chew/DangUBI_GitOps.git
    targetRevision: main
    path: manifests/data/mongodb
  destination:
    server: https://kubernetes.default.svc
    namespace: dangubi-data
  # Operator와 로컬 PV가 준비된 뒤 수동 동기화한다.
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
