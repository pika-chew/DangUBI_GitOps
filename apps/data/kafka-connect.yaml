# Kafka Connect 클러스터(KafkaConnect), 커넥터(Debezium MySQL Source, MongoDB Sink),
# 접속 정보 Secret을 만드는 ExternalSecret(debezium-cred, mongo-cred, ghcr-push)을 동기화한다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kafka-connect
  namespace: argocd
  annotations:
    # Kafka(wave 1), MySQL·MongoDB(wave 0), External Secrets(infra 단계)가 모두 준비된 뒤에 올라와야
    # Debezium이 binlog를 읽고 Sink가 MongoDB에 쓸 수 있다.
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: data

  source:
    repoURL: https://github.com/pika-chew/DangUBI_GitOps.git
    targetRevision: main
    path: manifests/data/kafka-connect

  destination:
    server: https://kubernetes.default.svc
    namespace: ubi-data

  syncPolicy:
    automated:
      # Connect 워커는 무상태다. 오프셋·설정·상태는 Kafka 내부 토픽에 남으므로
      # Git에서 빠진 커넥터나 리소스는 지워도 데이터가 사라지지 않는다.
      prune: true
      selfHeal: true
    syncOptions:
      # Strimzi CRD(wave 1)나 ExternalSecret CRD(infra)가 아직 없을 때 dry-run 실패를 무시한다.
      - SkipDryRunOnMissingResource=true
    retry:
      # kafka.yaml과 같다. Kafka·외부 Secret 준비 지연을 재시도로 흡수한다.
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
