# Kafka Connect 클러스터(KafkaConnect), 커넥터(Debezium MySQL Source, MongoDB Sink),
# 접속 정보 Secret을 만드는 ExternalSecret(debezium-cred, mongo-cred, ghcr-push)을 동기화한다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kafka-connect
  namespace: argocd
  annotations:
    # Kafka(wave 1), MySQL·MongoDB(wave 0), External Secrets(infra 단계)가 모두 준비된 뒤에 올라와야
    # Debezium이 binlog를 읽고 Sink가 MongoDB에 쓸 수 있다.
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: data

  source:
    repoURL: https://github.com/pika-chew/DangUBI_GitOps.git
    targetRevision: main
    path: manifests/data/kafka-connect

  destination:
    server: https://kubernetes.default.svc
    namespace: ubi-data

  syncPolicy:
    automated:
      # Connect 워커는 stateless(무상태)이다. 
      # 오프셋·설정·상태는 Kafka 내부 토픽에 남으므로, 깃에 빠진 커넥터 및 리소스는 지워도 데이터가 사라지지 않는다.
      prune: true
      selfHeal: true
    syncOptions:
      # 배포 전 검사(dry-run)는 클러스터에 아직 등록되지 않은 리소스 종류(KafkaConnect, ExternalSecret 등)를 만나면 실패한다.
      # 이 종류들은 kafka 앱(wave 1)과 External Secrets(infra)가 설치될 때 등록되므로, 그 전에는 검사만 건너뛴다.
      - SkipDryRunOnMissingResource=true
    retry:
      # kafka.yaml과 같다. Kafka·외부 Secret 준비 지연을 재시도로 흡수한다.
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
