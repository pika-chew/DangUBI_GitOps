# Strimzi 오퍼레이터(Helm chart)와 Kafka CR(KafkaNodePool, Kafka, KafkaTopic)을 하나의 Application으로 동기화한다.
# 오퍼레이터와 CR을 한 앱에 두어, 오퍼레이터 버전과 CR 스펙이 항상 같은 커밋 기준으로 함께 바뀌게 한다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kafka
  namespace: argocd
  annotations:
    # wave 0(MySQL, MongoDB) 다음, wave 2(kafka-connect)보다 먼저 올라와야 한다.
    argocd.argoproj.io/sync-wave: "1"
  # resources-finalizer는 일부러 달지 않는다.
  # Application을 지우는 것만으로 Kafka 클러스터와 토픽(=데이터)이 연쇄 삭제되는 일을 막기 위해서다.
spec:
  project: data

  sources:
    # source 1: Strimzi 오퍼레이터 chart. CRD, RBAC, 오퍼레이터 Deployment를 설치한다.
    - repoURL: https://strimzi.io/charts/
      chart: strimzi-kafka-operator
      # Strimzi 1.x부터 kafka.strimzi.io/v1만 받는다. CR도 v1으로만 작성한다.
      targetRevision: 1.3.0
      helm:
        releaseName: strimzi
        # values는 GitOps 저장소에서 관리한다($values = 아래 ref: values 소스).
        valueFiles:
          - $values/helm/kafka/values.yaml

    # source 2: GitOps 저장소. chart의 values 참조(ref)와 Kafka CR 매니페스트(path)를 함께 제공한다.
    - repoURL: https://github.com/pika-chew/DangUBI_GitOps.git
      targetRevision: main
      ref: values
      path: manifests/data/kafka

  destination:
    server: https://kubernetes.default.svc
    namespace: ubi-data

  syncPolicy:
    automated:
      # Kafka·KafkaNodePool·KafkaTopic CR이 지워지면 오퍼레이터가 브로커와 토픽 데이터를 실제로 삭제한다.
      # 매니페스트 실수 한 번이 데이터 유실로 이어지지 않도록 자동 prune을 끈다. 삭제는 사람이 수동으로 한다.
      prune: false
      # 클러스터에서 누가 CR을 직접 고쳐도 Git 상태로 되돌린다.
      selfHeal: true
    syncOptions:
      # Strimzi CRD는 스키마가 커서 client-side apply의 last-applied-configuration 주석(256KB) 제한을 넘는다.
      - ServerSideApply=true
      # 첫 동기화 때는 CRD가 아직 없어 Kafka CR dry-run이 실패한다. 이를 무시하고 진행하게 한다.
      - SkipDryRunOnMissingResource=true
    retry:
      # 오퍼레이터가 뜨기 전에 CR 적용이 실패하는 구간을 재시도로 흡수한다.
      # 30s → 1m → 2m → 4m → 5m(상한) ... 최대 10회.
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
