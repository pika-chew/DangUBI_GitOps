apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dangubi-collector
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: dangubi-workloads
  source:
    repoURL: https://github.com/pika-chew/DangUBI_GitOps.git
    targetRevision: main
    path: manifests/workloads/collector
  destination:
    server: https://kubernetes.default.svc
    namespace: dangubi
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
