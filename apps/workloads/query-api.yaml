# Query API(Spring) Application.
# MongoDB 읽기 모델(ubi_read)을 읽기 전용으로 조회한다. Argo Rollouts blue-green으로 배포한다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dangubi-query-api
  namespace: argocd
  annotations:
    # wave 3: MongoDB(0)와 Mongo Sink(2)가 뜬 뒤에 올라온다.
    argocd.argoproj.io/sync-wave: "3"
    # TODO: 이미지 태그 자동 갱신을 쓰면 여기에 주석을 추가한다.
spec:
  project: dangubi-workloads
  source:
    repoURL: https://github.com/pika-chew/DangUBI_GitOps.git
    targetRevision: main
    path: manifests/workloads/query
  destination:
    server: https://kubernetes.default.svc
    namespace: dangubi
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # TODO: Argo Rollouts 컨트롤러(Rollout CRD)가 먼저 설치돼 있어야 한다.
    #       첫 동기화 때 CRD가 없으면 SkipDryRunOnMissingResource=true와 retry를 고려한다.
