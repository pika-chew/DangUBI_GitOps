apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dangubi-query-api
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: dangubi-workloads
  source:
    repoURL: https://github.com/pika-chew/DangUBI_GitOps.git
    targetRevision: main
    path: manifests/workloads/query
  destination:
    server: https://kubernetes.default.svc
    namespace: dangubi
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # Rollout(Argo Rollouts)과 ExternalSecret은 각 컨트롤러가 설치될 때 등록되는 리소스 종류다.
      # 그 전에 동기화되면 배포 전 검사(dry-run)가 실패하므로, 등록 전에는 검사만 건너뛴다.
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
