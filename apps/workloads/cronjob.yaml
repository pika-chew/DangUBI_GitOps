# 주기 작업(CronJob) Application.
# Command·Query와 배포 주기가 달라 앱을 따로 둔다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dangubi-cronjob
  namespace: argocd
  annotations:
    # wave 3: 작업 대상인 MySQL·MongoDB가 뜬 뒤에 올라온다.
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: dangubi-workloads
  source:
    repoURL: https://github.com/pika-chew/DangUBI_GitOps.git
    targetRevision: main
    path: manifests/workloads/cronjob
  destination:
    server: https://kubernetes.default.svc
    namespace: dangubi
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
