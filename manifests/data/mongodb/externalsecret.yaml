apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dangubi-mongodb-app-passwords
  annotations:
    # Percona Operator가 앱 계정을 만들기 전에 비밀번호를 준비한다.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  refreshInterval: 1h
  target:
    name: dangubi-mongodb-app-passwords
    creationPolicy: Owner
  data:
    - secretKey: sink-password
      remoteRef:
        key: ubi/kafka-connect/mongo
        property: password
    - secretKey: query-password
      remoteRef:
        key: ubi/query/mongo
        property: password
