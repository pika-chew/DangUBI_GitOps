apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: dangubi-mongodb
spec:
  serviceName: mongodb-headless
  replicas: 3
  # 초기화 전에는 Ready가 되지 않으므로 모든 멤버를 먼저 기동한다. (0번이 Ready가 되기 전에도 1,2번 만들기)
  podManagementPolicy: Parallel
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels: # StatefulSet이 Label로 관리할 Pod 식별
      app.kubernetes.io/name: mongodb
      app.kubernetes.io/instance: dangubi-mongodb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mongodb
        app.kubernetes.io/instance: dangubi-mongodb
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true # root 실행 막음
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: # 컨테이너 런타임의 기본 보안필터 적용
          type: RuntimeDefault
      affinity:
        podAntiAffinity: # 같은 Label의 Pod들이 서로다른 Worker에 배치
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: mongodb
                  app.kubernetes.io/instance: dangubi-mongodb
              topologyKey: kubernetes.io/hostname
      initContainers:
        - name: prepare-keyfile
          image: docker.io/library/busybox:1.37.0
          # MongoDB는 그룹과 다른 사용자에게 권한이 없는 keyfile만 허용한다.
          command:
            - sh
            - -ec
            - |
              umask 077
              rm -f /mongodb-auth/keyfile
              cp /keyfile-source/keyfile /mongodb-auth/keyfile
              chmod 0400 /mongodb-auth/keyfile
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
          volumeMounts:
            - name: keyfile-source
              mountPath: /keyfile-source
              readOnly: true
            - name: auth
              mountPath: /mongodb-auth
      containers:
        - name: mongodb
          image: docker.io/library/mongo:8.0.34
          args:
            - mongod
            - --replSet
            - dangubi-mongodb
            - --bind_ip_all
            - --keyFile
            - /mongodb-auth/keyfile
          env:
            - name: HOME
              value: /tmp
          ports:
            - name: mongodb
              containerPort: 27017
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 500m
              memory: 4Gi
            limits:
              memory: 4Gi
          startupProbe:
            tcpSocket:
              port: mongodb
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command:
                - mongosh
                - --norc
                - --quiet
                - mongodb://127.0.0.1:27017/?directConnection=true
                - --eval
                - >-
                  const hello = db.hello();
                  quit(hello.setName === "dangubi-mongodb" &&
                    (hello.isWritablePrimary || hello.secondary) ? 0 : 1);
            periodSeconds: 15
            timeoutSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data/db
            - name: auth
              mountPath: /mongodb-auth
              readOnly: true
      volumes:
        - name: keyfile-source
          secret:
            secretName: dangubi-mongodb-keyfile
            defaultMode: 0440
            items:
              - key: keyfile
                path: keyfile
        - name: auth
          emptyDir:
            medium: Memory
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-mongodb
        resources:
          requests:
            storage: 20Gi
