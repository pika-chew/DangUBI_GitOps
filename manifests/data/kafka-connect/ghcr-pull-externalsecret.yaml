apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: connect-ghcr-pull
  annotations:
    # KafkaConnect(wave 2)보다 우선.
    argocd.argoproj.io/sync-wave: "0"
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  refreshInterval: 1h
  target:
    name: connect-ghcr-pull
    creationPolicy: Owner
    template:
      # imagePullSecrets는 docker 설정 형식의 Secret만 받는다.
      type: kubernetes.io/dockerconfigjson
      data:
        # Vault의 user·token을 "user:token" base64로 묶어 docker 로그인 형식으로 만든다.
        .dockerconfigjson: '{"auths":{"ghcr.io":{"auth":"{{ printf "%s:%s" .user .token | b64enc }}"}}}'
  data:
    - secretKey: user
      remoteRef:
        key: ubi/ghcr-pull
        property: user
    - secretKey: token
      remoteRef:
        key: ubi/ghcr-pull
        property: token
