# GHCR 비공개 이미지 pull용 Secret (Vault → Secret)
# kubelet이 Connect 이미지(dangubi-connect)를 받을 때 쓴다. kafka-connect.yaml의 template.pod.imagePullSecrets에서 참조한다.
# 토큰은 read:packages 권한만 가진 pull 전용 토큰이다(push용 ghcr-push와 분리).
# collector·cronjob 앱도 같은 Vault 경로를 읽어 자기 Secret(collector-ghcr-pull, batch-ghcr-pull)을 따로 만든다.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: connect-ghcr-pull
  annotations:
    # KafkaConnect(wave 2)보다 우선.
    argocd.argoproj.io/sync-wave: "0"
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  refreshInterval: 1h
  target:
    name: connect-ghcr-pull
    creationPolicy: Owner
    template:
      # imagePullSecrets는 docker 설정 형식의 Secret만 받는다.
      type: kubernetes.io/dockerconfigjson
      data:
        # Vault의 user·token을 "user:token" base64로 묶어 docker 로그인 형식으로 만든다.
        .dockerconfigjson: '{"auths":{"ghcr.io":{"auth":"{{ printf "%s:%s" .user .token | b64enc }}"}}}'
  data:
    - secretKey: user
      remoteRef:
        key: ubi/ghcr-pull
        property: user
    - secretKey: token
      remoteRef:
        key: ubi/ghcr-pull
        property: token
