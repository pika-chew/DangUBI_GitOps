# Kafka Connect 클러스터와 커넥터(Debezium MySQL Source, MongoDB Sink).
# apps/data/kafka-connect.yaml이 이 경로를 동기화한다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# AppProject dangubi-data가 허용하는 네임스페이스. Strimzi 오퍼레이터도 이 네임스페이스만 감시한다.
# [Connect 이동] 채울 것: dangubi-connect로 바꾸고 위 주석도 고친다.
# 이 폴더의 리소스(ExternalSecret 4개, Role·RoleBinding, KafkaConnect, KafkaConnector 2개)가 모두 함께 옮겨진다.
# KafkaConnector는 KafkaConnect와 같은 네임스페이스에 있어야 Strimzi가 찾는다.
namespace: dangubi-data

# 적용 순서는 각 파일의 sync-wave가 정한다. 
# 목록 순서는 읽는 순서(Secret → 권한 → Connect → 커넥터)에 맞췄다.
resources:
  - externalsecrets.yaml
  - ghcr-pull-externalsecret.yaml   # GHCR 비공개 이미지 pull 계정 (collector·cronjob과 같은 Vault 경로)
  - rbac.yaml
  - kafka-connect.yaml
  - connector-debezium-outbox.yaml
  - connector-mongo-sink.yaml
