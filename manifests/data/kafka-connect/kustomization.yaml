# Kafka Connect 클러스터와 커넥터(Debezium MySQL Source, MongoDB Sink).
# apps/data/kafka-connect.yaml이 이 경로를 동기화한다.
#
# Deployment·Service·ConfigMap을 직접 쓰지 않는다.
# - Connect 워커의 Deployment·Service·ConfigMap은 Strimzi 오퍼레이터가 KafkaConnect CR을 보고 만든다.
# - 커넥터는 KafkaConnector CR을 적용하는 것 자체가 등록이다. 그래서 REST API로 커넥터를 등록하는 Job이 필요 없다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# AppProject dangubi-data가 허용하는 네임스페이스. Strimzi 오퍼레이터도 이 네임스페이스만 감시한다.
namespace: dangubi-data

# 적용 순서는 각 파일의 sync-wave가 정한다. 목록 순서는 읽는 순서(Secret → 권한 → Connect → 커넥터)에 맞췄다.
resources:
  - externalsecrets.yaml
  - rbac.yaml
  - kafka-connect.yaml
  - connector-debezium-outbox.yaml
  - connector-mongo-sink.yaml
