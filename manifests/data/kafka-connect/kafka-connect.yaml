# Kafka Connect 클러스터. Source(Debezium)와 Sink(MongoDB)가 같은 워커 위에서 돈다.
apiVersion: kafka.strimzi.io/v1
kind: KafkaConnect
metadata:
  name: ubi-connect
  annotations:
    # 커넥터를 REST API가 아니라 KafkaConnector CR로 관리한다. Git이 커넥터 설정의 원본이 된다.
    strimzi.io/use-connector-resources: "true"
    # Secret(wave 0)과 권한(wave 1)이 준비된 뒤에 뜬다.
    argocd.argoproj.io/sync-wave: "2"
spec:
  # Kafka CR과 같은 버전으로 맞춘다.
  version: 4.3.1
  # 1대가 죽으면 남은 워커로 태스크가 재배정된다.
  replicas: 2
  bootstrapServers: dangubi-kafka-kafka-bootstrap:9092

  # Connect 클러스터 식별자와 내부 토픽. Strimzi v1에서는 spec.config가 아니라 여기 필수 필드로 쓴다.
  groupId: ubi-connect
  configStorageTopic: ubi-connect-configs
  # Source 커넥터의 binlog 위치(GTID)가 저장된다. 지워지면 Debezium이 어디부터 읽을지 잃어버린다.
  offsetStorageTopic: ubi-connect-offsets
  statusStorageTopic: ubi-connect-status

  config:
    # 내부 토픽도 RF3으로 만든다. 브로커 1대 장애에도 오프셋·설정이 남는다.
    config.storage.replication.factor: 3
    offset.storage.replication.factor: 3
    status.storage.replication.factor: 3
    # 커넥터 설정에서 ${secrets:<네임스페이스>/<Secret>:<키>}로 Secret 값을 참조할 수 있게 한다.
    # 비밀번호가 KafkaConnector CR(Git)에 평문으로 들어가지 않는다.
    config.providers: secrets
    config.providers.secrets.class: io.strimzi.kafka.KubernetesSecretConfigProvider

  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      # CPU 상한은 두지 않는다(스로틀링 방지).
      memory: 1536Mi
  jvmOptions:
    -Xms: 768m
    -Xmx: 768m

  template:
    pod:
      # GHCR 패키지가 private이면 빌드한 이미지를 pull할 때도 로그인이 필요하다.
      imagePullSecrets:
        - name: ghcr-push
      topologySpreadConstraints:
        # 무상태라 반드시 나눌 필요는 없다. 가능하면 다른 물리 호스트에 두고, 안 되면 같은 호스트도 허용한다.
        - maxSkew: 1
          topologyKey: ubi.io/host
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              strimzi.io/cluster: ubi-connect
              strimzi.io/kind: KafkaConnect

  # Strimzi가 플러그인을 넣은 Connect 이미지를 직접 빌드해 GHCR에 push하고, push된 digest로 pull한다.
  build:
    output:
      type: docker
      # GitHub 계정(조직)이 정해지면 교체한다.
      image: ghcr.io/CHANGE_ME_GITHUB_OWNER/ubi-connect:latest
      pushSecret: ghcr-push
    plugins:
      - name: debezium-mysql
        artifacts:
          # Debezium은 의존성이 모두 들어 있는 plugin.tar.gz 배포를 권장한다.
          - type: tgz
            url: https://repo1.maven.org/maven2/io/debezium/debezium-connector-mysql/3.7.0.Final/debezium-connector-mysql-3.7.0.Final-plugin.tar.gz
      - name: mongodb-sink
        artifacts:
          # maven 타입은 런타임 의존성까지 함께 받아 온다.
          - type: maven
            group: org.mongodb.kafka
            artifact: mongo-kafka-connect
            version: 3.1.2
