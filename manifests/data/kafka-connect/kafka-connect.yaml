# Kafka Connect 클러스터.
apiVersion: kafka.strimzi.io/v1
kind: KafkaConnect
metadata:
  name: dangubi-connect
  annotations:
    strimzi.io/use-connector-resources: "true"
    # Secret(wave 0)과 권한(wave 1)이 준비된 뒤에 뜬다.
    argocd.argoproj.io/sync-wave: "2"
spec:
  version: 4.3.1
  # 1대가 죽으면 남은 워커로 태스크가 재배정된다.
  replicas: 2
  bootstrapServers: dangubi-kafka-kafka-bootstrap:9092

  # Connect 클러스터 식별자와 내부 토픽.
  groupId: dangubi-connect
  configStorageTopic: dangubi-connect-configs
  offsetStorageTopic: dangubi-connect-offsets
  statusStorageTopic: dangubi-connect-status

  config:
    # 내부 토픽도 RF3으로 만든다. 브로커 1대 장애에도 오프셋·설정이 남는다.
    config.storage.replication.factor: 3
    offset.storage.replication.factor: 3
    status.storage.replication.factor: 3
    # 커넥터 설정에서 Secret 값을 참조
    # 비밀번호가 KafkaConnector CR(Git)에 평문으로 들어가지 않는다.
    config.providers: secrets
    config.providers.secrets.class: io.strimzi.kafka.KubernetesSecretConfigProvider

  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      # CPU 상한은 두지 않는다(스로틀링 방지).
      memory: 1536Mi
  jvmOptions:
    -Xms: 768m
    -Xmx: 768m

  template:
    pod:
      topologySpreadConstraints:
        # 가능하면 다른 노드에 두고, 안 되면 같은 노드도 허용한다.
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              strimzi.io/cluster: dangubi-connect
              strimzi.io/kind: KafkaConnect

  # Strimzi가 플러그인을 넣은 Connect 이미지를 직접 빌드해 GHCR에 push하고, push된 digest로 pull한다.
  build:
    output:
      type: docker
      image: ghcr.io/pika-chew/dangubi-connect:latest
      pushSecret: ghcr-push
    plugins:
      - name: debezium-mysql
        artifacts:
          - type: tgz
            url: https://repo1.maven.org/maven2/io/debezium/debezium-connector-mysql/3.7.0.Final/debezium-connector-mysql-3.7.0.Final-plugin.tar.gz
      - name: mongodb-sink
        artifacts:
          - type: maven
            group: org.mongodb.kafka
            artifact: mongo-kafka-connect
            version: 3.1.2
