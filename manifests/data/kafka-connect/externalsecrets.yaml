apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: debezium-cred
  annotations:
    # KafkaConnect(wave 2)와 커넥터(wave 3)보다 우선.
    argocd.argoproj.io/sync-wave: "0"
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  # Vault에서 값을 바꾸면 최대 1시간 안에 Secret에 반영된다.
  refreshInterval: 1h
  target:
    name: debezium-cred
    # 이 ExternalSecret이 Secret의 주인이다. ExternalSecret을 지우면 Secret도 같이 지워진다.
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: ubi/kafka-connect/debezium
        property: username
    - secretKey: password
      remoteRef:
        key: ubi/kafka-connect/debezium
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mongo-cred
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  refreshInterval: 1h
  target:
    name: mongo-cred
    creationPolicy: Owner
  data:
    - secretKey: uri
      remoteRef:
        key: ubi/kafka-connect/mongo
        property: uri
---
# GHCR 로그인 정보. Strimzi가 플러그인 이미지를 빌드해 GHCR에 push할 때(pushSecret) 쓴다.
# 패키지가 public이라 pull에는 쓰지 않는다.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-push
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  refreshInterval: 1h
  target:
    name: ghcr-push
    creationPolicy: Owner
    template:
      # pushSecret은 docker 설정 형식의 Secret만 받는다.
      type: kubernetes.io/dockerconfigjson
      data:
        # Vault의 user·token을 "user:token" base64로 묶어 docker 로그인 형식으로 만든다.
        .dockerconfigjson: '{"auths":{"ghcr.io":{"auth":"{{ printf "%s:%s" .user .token | b64enc }}"}}}'
  data:
    - secretKey: user
      remoteRef:
        key: ubi/kafka-connect/ghcr
        property: user
    - secretKey: token
      remoteRef:
        key: ubi/kafka-connect/ghcr
        property: token
