# Topic list. 여기 없는 토픽은 생성되지 않는다.(kafka.yaml의 Kafka 참고)
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: outbox.vehicle-summary
  labels:
    strimzi.io/cluster: dangubi-kafka
  annotations:
    # 선 : Kafka 클러스터(wave 1) / 후 : Kafka Topic(wave 2)
    argocd.argoproj.io/sync-wave: "2"
# Debezium Event Router와 반드시 일치해야 한다.(connector-debezium-outbox.yaml 참고)
spec:
  topicName: outbox.vehicle_summary
  # 키(vehicle_id) 기준으로 파티션이 정해져 차량별 순서가 보장된다. Sink tasksMax 3과 맞춘다.
  partitions: 3
  replicas: 3
  config:
    # 7일
    retention.ms: 604800000
    min.insync.replicas: 2
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: outbox.trip-score
  labels:
    strimzi.io/cluster: dangubi-kafka
