# Kafka와 토픽을 한 앱(kafka)으로 묶는 이유
# - 순서: 토픽은 Kafka가 Ready가 된 뒤에 만들어진다. 같은 앱이면 sync-wave(Kafka 1 → 토픽 2)만으로 순서가 보장된다.
# - 보호: 토픽 CR을 지우면 메시지도 지워진다. Kafka와 같이 prune: false로 자동 삭제를 막는다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dangubi-data

resources:
  - kafka.yaml
  - topics.yaml
