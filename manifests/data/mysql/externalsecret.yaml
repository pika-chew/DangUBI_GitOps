apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dangubi-mysql-root
  annotations:
    # InnoDBCluster보다 초기 관리자 Secret을 먼저 준비한다.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  refreshInterval: 1h
  target:
    name: dangubi-mysql-root
    creationPolicy: Owner
  data:
    - secretKey: rootUser
      remoteRef:
        key: ubi/mysql/root
        property: rootUser
    - secretKey: rootPassword
      remoteRef:
        key: ubi/mysql/root
        property: rootPassword
