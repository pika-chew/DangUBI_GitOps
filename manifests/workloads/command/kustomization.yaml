# Command API 매니페스트 묶음. apps/workloads/command-api.yaml이 이 경로를 동기화한다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# AppProject dangubi-workloads가 허용하는 네임스페이스.
namespace: dangubi

resources:
  - externalsecret.yaml   # MySQL 접속 정보 (Vault → Secret)
  - configmap.yaml        # Spring 설정 (DB 주소, 프로필 등)
  - deployment.yaml       # API 파드
  - service.yaml          # API 접속 주소
  # TODO: 외부 노출 방식이 정해지면 추가한다 (Ingress / LoadBalancer).
  # TODO: 필요하면 PodDisruptionBudget, HorizontalPodAutoscaler를 추가한다.
