apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: collector
  name: collector
spec:
  replicas: 2
  selector:
    matchLabels:
      app: collector
  template:
    metadata:
      labels:
        app: collector
    spec:
      # 파드 2개를 서로 다른 노드에 나눠 띄운다. 노드 하나가 죽어도 1개는 남는다.
      # ScheduleAnyway: 나눌 노드가 부족하면 같은 노드에라도 띄운다(배포가 멈추지 않게).
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: collector
      # 파드 종료 시 SIGTERM을 받은 워커가 정리할 시간(초).
      # 처리 중이던 SQS 메시지는 삭제되지 않고 큐로 돌아가 다른 파드가 다시 처리한다.
      terminationGracePeriodSeconds: 30
      imagePullSecrets:
      - name: collector-ghcr-pull
      containers:
      # kustomization.yaml images의 name과 같은 값. 실제 주소·태그는 그쪽에서 바뀐다.
      - image: dangubi-collector
        name: dangubi-be-collector
        # 바이너리는 --worker 인자가 있어야 SQS 폴링을 시작한다.
        args: ["--worker"]
        ports:
        - name: http
          containerPort: 8080
        # 비밀이 아닌 설정(SQS·S3·리전)은 ConfigMap에서 통째로 환경 변수로 받는다.
        envFrom:
        - configMapRef:
            name: collector-config
        # AWS·Swift 인증 정보와 Swift 컨테이너명·인증 URL. Secret의 키가 곧 환경 변수 이름이다(externalsecret.yaml의 collector-cloud-cred).
        - secretRef:
            name: collector-cloud-cred
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 256Mi
        # startupProbe: 시작 시 Swift 인증·컨테이너 확인(최대 30초)이 끝나야 헬스 서버가 뜬다.
        # 최대 5초 x 12 = 60초 동안 아래 두 probe를 미룬다.
        startupProbe:
          httpGet:
            path: /livez
            port: http
          periodSeconds: 5
          failureThreshold: 12
        # readinessProbe: 최근 SQS 수신과 Swift 컨테이너 조회가 성공했는지 본다(실패해도 재시작은 안 함).
        # 앱 쪽 Swift 확인 제한이 2초라 timeout을 3초로 둔다.
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          timeoutSeconds: 3
          periodSeconds: 10
          failureThreshold: 3
        # livenessProbe: HTTP 서버 응답만 본다. 외부 서비스 장애로 재시작되지 않게 앱이 이렇게 나눠 두었다.
        livenessProbe:
          httpGet:
            path: /livez
            port: http
          periodSeconds: 10
          failureThreshold: 3
