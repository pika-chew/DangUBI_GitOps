# Collector 매니페스트 묶음. apps/workloads/collector.yaml이 이 경로를 동기화한다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dangubi

resources:
  - externalsecret.yaml   # MySQL 접속 계정 (Vault → Secret)
  - ghcr-pull-externalsecret.yaml   # GHCR 비공개 이미지 pull 계정 (Vault → Secret)
  - configmap.yaml        # 비밀이 아닌 설정
  - deployment.yaml       # API 파드
  # - service.yaml        # 현재 사용 안 함 (SQS 워커라 들어오는 요청 없음, 이유는 파일 상단 참고)

# DangUBI_Collector의 Jenkins main 빌드가 name이 dangubi-collector인 항목을 찾아
# newTag(커밋 SHA 7자리)를 바꾸고 그 아래에 digest 줄을 쓴다. name과 줄 구성을 바꾸지 않는다.
# "initial"은 첫 빌드 전 자리표시 값이라 실제 이미지가 없다.
images:
  - name: dangubi-collector
    newName: ghcr.io/pika-chew/dangubi-collector
    newTag: "initial"
