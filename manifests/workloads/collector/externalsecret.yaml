apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: collector-mysql-cred
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  refreshInterval: 1h
  target:
    name: collector-mysql-cred
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: ubi/collector/mysql
        property: username
    - secretKey: password
      remoteRef:
        key: ubi/collector/mysql
        property: password
