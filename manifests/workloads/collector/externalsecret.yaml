# Collector가 MySQL에 쓰는 계정. 비밀 값은 Git에 두지 않고 Vault에서 가져온다.
# Debezium 계정과 분리한다: Collector는 수집 데이터를 쓰는 INSERT·UPDATE 권한이 필요하고, Debezium은 읽기·복제 권한만 필요하다.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: collector-mysql-cred
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  refreshInterval: 1h
  target:
    name: collector-mysql-cred
    creationPolicy: Owner
  data:
    # TODO: Vault 경로와 키 이름을 Vault 담당과 맞춘다.
    - secretKey: username
      remoteRef:
        key: CHANGE_ME
        property: username
    - secretKey: password
      remoteRef:
        key: CHANGE_ME
        property: password
