# collector-mysql-cred (ExternalSecret)
# - 역할: Collector가 MySQL에 쓰는 계정을 Vault에서 가져와 Secret으로 만든다. 비밀 값은 Git에 두지 않는다.
# - Debezium 계정(읽기·복제 권한)과 분리한다. Collector는 쓰기(INSERT·UPDATE) 권한이 필요하다.
# - 채울 것: secretStoreRef(ClusterSecretStore vault), refreshInterval, target(Secret 이름, creationPolicy),
#           data(Vault 경로·키 → username, password). 경로는 Vault 담당과 맞춘다.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: collector-mysql-cred
