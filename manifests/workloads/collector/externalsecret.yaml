apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: collector-cloud-cred
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  refreshInterval: 1h
  target:
    name: collector-cloud-cred
    creationPolicy: Owner
  # Deployment가 이 Secret을 envFrom으로 읽으므로 secretKey를 환경 변수 이름 그대로 쓴다.
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: ubi/collector/aws
        property: access_key_id
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: ubi/collector/aws
        property: secret_access_key
    - secretKey: OS_APPLICATION_CREDENTIAL_ID
      remoteRef:
        key: ubi/collector/swift
        property: app_cred_id
    - secretKey: OS_APPLICATION_CREDENTIAL_SECRET
      remoteRef:
        key: ubi/collector/swift
        property: app_cred_secret