apiVersion: v1
kind: ConfigMap
metadata:
  name: query-api-config
data:
  SPRING_PROFILES_ACTIVE: prod
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
  SERVER_SHUTDOWN: graceful
  # 힙을 메모리 limit(1Gi)의 65%(약 665Mi)로 제한한다.
  # 나머지 약 360Mi는 메타스페이스·스레드 스택·코드 캐시·드라이버 버퍼 등 힙 밖 메모리 몫이다.
  JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=65.0
