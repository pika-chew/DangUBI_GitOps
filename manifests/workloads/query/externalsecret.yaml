apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: query-mongo-cred
  annotations:
    # Rollout(wave 0)보다 먼저 Secret을 만든다.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  refreshInterval: 1h
  target:
    name: query-mongo-cred
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # 읽기 전용 계정과 같은 Vault 비밀번호를 URI에 넣는다.
        SPRING_DATA_MONGODB_URI: 'mongodb://ubi_query:{{ .password | urlquery | replace "+" "%20" }}@dangubi-mongodb-rs0.dangubi-data.svc.cluster.local:27017/ubi_read?replicaSet=rs0&authSource=ubi_read&tls=false'
  data:
    - secretKey: password
      remoteRef:
        key: ubi/query/mongo
        property: password
