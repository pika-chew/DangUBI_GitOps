# query-mongo-cred (ExternalSecret)
# - 역할: Query가 MongoDB(ubi_read)를 읽는 계정을 Vault에서 가져와 Secret으로 만든다.
# - 읽기 전용(read) 권한만 둔다. Mongo Sink 계정(readWrite)과 분리한다.
# - 채울 것: secretStoreRef(ClusterSecretStore vault), target, data(Vault 경로·키 → uri 또는 계정·비밀번호)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: query-mongo-cred
