# Query가 MongoDB(ubi_read)를 읽는 계정. 읽기 전용(read) 권한만 둔다.
# Mongo Sink 계정(ubi_sink, readWrite)과 분리한다.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: query-mongo-cred
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  refreshInterval: 1h
  target:
    name: query-mongo-cred
    creationPolicy: Owner
  data:
    # TODO: Vault 경로와 키 이름을 Vault·MongoDB 담당과 맞춘다. (URI 하나로 받을지, 계정·비밀번호로 나눌지)
    - secretKey: uri
      remoteRef:
        key: CHANGE_ME
        property: uri
