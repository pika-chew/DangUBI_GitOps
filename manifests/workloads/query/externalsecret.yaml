# - Vault ubi/query/mongo 의 uri 예: mongodb://<user>:<password>@<host>:27017/ubi_read?authSource=<인증 DB>
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: query-mongo-cred
  annotations:
    # Rollout(wave 0)보다 먼저 Secret을 만든다.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  refreshInterval: 1h
  target:
    name: query-mongo-cred
    creationPolicy: Owner
  data:
    - secretKey: SPRING_DATA_MONGODB_URI
      remoteRef:
        key: ubi/query/mongo
        property: uri
