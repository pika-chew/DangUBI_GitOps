# blue-green용 Service 2개. 셀렉터는 Argo Rollouts가 배포 중에 자동으로 바꾼다.
# - active : 실제 사용자 트래픽이 가는 쪽 (현재 버전)
# - preview: 새 버전을 승격(promote) 전에 미리 확인하는 쪽
apiVersion: v1
kind: Service
metadata:
  name: query-api-active
  labels:
    app.kubernetes.io/name: query-api
spec:
  # TODO: 외부 노출 방식 (ClusterIP / LoadBalancer)
  type: ClusterIP
  selector:
    app.kubernetes.io/name: query-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: query-api-preview
  labels:
    app.kubernetes.io/name: query-api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: query-api
  ports:
    - name: http
      port: 80
      targetPort: http
