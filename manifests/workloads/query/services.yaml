# blue-green용 Service 2개.
# - query-api-active : 실제 사용자 트래픽이 가는 쪽 (현재 버전)
# - query-api-preview: 새 버전을 승격 전에 미리 확인하는 쪽
apiVersion: v1
kind: Service
metadata:
  name: query-api-active
  labels:
    app.kubernetes.io/name: query-api
    app.kubernetes.io/part-of: dangubi
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: query-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: query-api-preview
  labels:
    app.kubernetes.io/name: query-api
    app.kubernetes.io/part-of: dangubi
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: query-api
  ports:
    - name: http
      port: 80
      targetPort: http
