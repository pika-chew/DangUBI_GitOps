# blue-green용 Service 2개.
# - query-api-active : 실제 사용자 트래픽이 가는 쪽 (현재 버전). 외부에서 접속하므로 LoadBalancer로 VIP를 받는다.
# - query-api-preview: 새 버전을 승격 전에 미리 확인하는 쪽. 클러스터 안에서만 확인하므로 ClusterIP로 둔다.
apiVersion: v1
kind: Service
metadata:
  name: query-api-active
  labels:
    app.kubernetes.io/name: query-api
    app.kubernetes.io/part-of: dangubi
  annotations:
    # MetalLB query-api-vip 풀(manifests/infra/metallb/query-api-vip.yaml)의 VIP. 풀이 autoAssign: false라 IP를 직접 지정한다.
    metallb.io/loadBalancerIPs: 172.16.10.202
spec:
  type: LoadBalancer
  # MetalLB L2는 VIP로 직접 받으므로 NodePort가 필요 없다. 모든 노드에 우회 경로가 열리지 않게 한다.
  allocateLoadBalancerNodePorts: false
  selector:
    app.kubernetes.io/name: query-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: query-api-preview
  labels:
    app.kubernetes.io/name: query-api
    app.kubernetes.io/part-of: dangubi
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: query-api
  ports:
    - name: http
      port: 80
      targetPort: http
