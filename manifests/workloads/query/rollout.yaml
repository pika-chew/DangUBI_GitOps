#   4개 기준 CPU requests 2, 메모리 requests 3Gi, limits 4Gi (dangubi 쿼터 8 / 8Gi / 12Gi 안, docs/bootstrap.md 예산 참고).
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: query-api
  labels:
    app.kubernetes.io/name: query-api
    app.kubernetes.io/part-of: dangubi
spec:
  replicas: 2
  # 되돌릴 수 있는 이전 ReplicaSet 개수.
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: query-api
  strategy:
    blueGreen:
      activeService: query-api-active
      previewService: query-api-preview
      autoPromotionEnabled: false
      # 승격 직후 이전 버전(blue)을 30초 더 남겨, 바뀐 엔드포인트가 퍼지는 동안 들어온 요청을 받게 한다.
      scaleDownDelaySeconds: 30
  template:
    metadata:
      labels:
        app.kubernetes.io/name: query-api
        app.kubernetes.io/part-of: dangubi
    spec:
      terminationGracePeriodSeconds: 45
      containers:
        - name: query-api
          # TODO: Query 앱 저장소·이미지 빌드가 생기면 실제 경로·태그로 바꾼다.
          image: ghcr.io/pika-chew/dangubi-query-api:0.1.0
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: query-api-config
            - secretRef:
                name: query-mongo-cred
          resources:
            requests:
              cpu: 500m
              memory: 768Mi
            limits:
              memory: 1Gi
          # 기동이 끝날 때까지 liveness·readiness를 미룬다. 최대 10초 x 18 = 3분.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 18
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: query-api
          matchLabelKeys:
            - rollouts-pod-template-hash
