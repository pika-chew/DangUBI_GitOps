# Query API 매니페스트 묶음. apps/workloads/query-api.yaml이 이 경로를 동기화한다.
# Deployment 대신 Argo Rollouts의 Rollout(blue-green)을 쓴다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dangubi

resources:
  - externalsecret.yaml   # MongoDB 읽기 전용 접속 정보 (Vault → Secret)
  - configmap.yaml        # Spring 설정
  - services.yaml         # active(운영) / preview(새 버전 확인용) Service 2개
  - rollout.yaml          # blue-green 배포 단위
  # TODO: 자동 검증을 쓰면 AnalysisTemplate을 추가한다.
  # TODO: 외부 노출 방식이 정해지면 추가한다 (Ingress / LoadBalancer).
