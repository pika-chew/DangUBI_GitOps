apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dangubi

resources:
  - externalsecret.yaml   # MongoDB 읽기 전용 접속 URI (Vault → Secret)
  - configmap.yaml        # 비밀이 아닌 설정
  - services.yaml         # active / preview Service 2개
  - rollout.yaml          # blue-green 배포 단위
