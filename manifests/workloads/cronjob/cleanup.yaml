# cleanup: 매일 06:00. 배치 앱의 cleanupJob을 실행한다.
# 03:00 daily-pipeline이 끝난 뒤에 돌아, 처리가 끝난 데이터만 정리한다.
# outbox 정리도 여기서 한다면: Debezium이 아직 못 읽은 행을 지우지 않도록 보존 기간을 넉넉히 둔다.
# (지워도 Kafka에는 영향 없음: Debezium tombstones.on.delete=false, Event Router는 DELETE를 무시)
# TODO: 정리 대상과 보존 기간
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cleanup
  labels:
    app.kubernetes.io/name: cleanup
    app.kubernetes.io/component: batch
    app.kubernetes.io/part-of: dangubi
spec:
  schedule: "0 6 * * *"
  timeZone: Asia/Seoul
  suspend: false
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: cleanup
            app.kubernetes.io/component: batch
        spec:
          restartPolicy: Never
          containers:
            - name: batch
              image: dangubi-batch
              args: ["cleanupJob"]
              envFrom:
                - configMapRef:
                    name: batch-config
                - secretRef:
                    name: batch-db-cred
              # 필수: dangubi 네임스페이스 ResourceQuota 때문에 requests·limits가 없으면 파드가 생성되지 않는다.
              resources:
                requests:
                  cpu: CHANGE_ME
                  memory: CHANGE_ME
                limits:
                  memory: CHANGE_ME
