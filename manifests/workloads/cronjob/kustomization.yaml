# 배치 작업 묶음. apps/workloads/cronjob.yaml이 이 경로를 동기화한다.
#
# 구조
# - 작업 하나 = CronJob 하나. 서로를 부르거나 묶지 않는다.
# - 순서(백업 02:00 → 파이프라인 03:00 → 정리 06:00)는 시간으로만 맞춘다. 앞 작업이 끝났는지는 확인하지 않는다.
#   "앞 단계가 끝나야 다음 단계"가 필요하면 배치 앱의 한 Job 안에 Step으로 묶는다.
# - 하루 묶음(정합성 검토 → 적재 → 점수 계산)은 daily-pipeline 하나가 dailyPipelineJob으로 실행한다.
#   reconcile·ingest·score는 각 단계를 따로 테스트하기 위한 Job 틀이다 (suspend, 스스로 돌지 않음).
#   실행: kubectl -n dangubi create job --from=cronjob/<이름> <이름>-manual-$(date +%s)
# - Job이 아니라 CronJob(suspend)으로 두는 이유: Job은 Argo CD가 동기화로 만드는 순간 한 번 실행되고 끝난다.
#   다시 돌릴 수 없고, 지우면 selfHeal이 다시 만들어 또 실행한다. CronJob은 틀만 보관하고 --from으로 몇 번이든 찍어 낸다.
# - 배치 앱 작업 6개는 같은 이미지에 실행할 Job 이름(args)만 다르다.
# - CronJob과 다른 값(이미지 태그, args·Job 파라미터)으로 한 번 돌릴 때는 매니페스트를 따로 두지 않고 뽑아서 고친다:
#   kubectl -n dangubi create job --from=cronjob/<이름> <이름>-manual-$(date +%s) --dry-run=client -o yaml > job.yaml
#   job.yaml의 image·args를 고친 뒤 kubectl create -f job.yaml
#
# 채울 것
# - images: 배치 앱 이미지 경로·태그를 여기 한 곳에서 정하고, 각 CronJob은 같은 이름(예: dangubi-batch)으로 참조
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dangubi

resources:
  # 배치 앱 공용
  - batch-config.yaml           # 공용 설정
  - batch-externalsecret.yaml   # 공용 DB 계정
  # 스케줄 작업 (시간순)
  # db-backup·monthly-finalize·cleanup은 아직 spec이 없는 틀이라 동기화에서 뺀다.
  # spec(schedule·jobTemplate)이 없는 CronJob은 API 서버 검증에서 거부되고, 그러면 이 앱 전체 sync가 실패한다.
  # 매니페스트를 채우면 주석을 푼다.
  # - db-backup.yaml            # 매일 02:00, 배치 앱 아님
  - daily-pipeline.yaml         # 매일 03:00
  # - monthly-finalize.yaml     # 매월 1일 05:00
  # - cleanup.yaml              # 매일 06:00
  # 테스트용 Job 틀 (suspend: true, daily-pipeline 묶음의 각 단계)
  - reconcile.yaml
  - ingest.yaml
  - score.yaml
