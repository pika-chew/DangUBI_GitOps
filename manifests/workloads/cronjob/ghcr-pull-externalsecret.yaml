# GHCR 비공개 이미지 pull용 Secret (Vault → Secret)
# kubelet이 이미지를 받을 때 쓴다. kustomization.yaml의 patch가 모든 CronJob에 imagePullSecrets로 붙인다.
# 토큰은 read:packages 권한만 가진 pull 전용 토큰이다(Jenkins push 토큰과 분리).
# collector 앱도 같은 Vault 경로를 읽어 자기 Secret(collector-ghcr-pull)을 따로 만든다.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: batch-ghcr-pull
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  refreshInterval: 1h
  target:
    name: batch-ghcr-pull
    creationPolicy: Owner
    template:
      # imagePullSecrets는 docker 설정 형식의 Secret만 받는다.
      type: kubernetes.io/dockerconfigjson
      data:
        # Vault의 user·token을 "user:token" base64로 묶어 docker 로그인 형식으로 만든다.
        .dockerconfigjson: '{"auths":{"ghcr.io":{"auth":"{{ printf "%s:%s" .user .token | b64enc }}"}}}'
  data:
    - secretKey: user
      remoteRef:
        key: ubi/ghcr-pull
        property: user
    - secretKey: token
      remoteRef:
        key: ubi/ghcr-pull
        property: token
