# 테스트용 Job 틀: 정합성 검토(reconcileJob)만 따로 실행한다. 스케줄로는 돌지 않는다.
# 직접 실행: kubectl -n dangubi create job --from=cronjob/reconcile reconcile-manual-$(date +%s)
apiVersion: batch/v1
kind: CronJob
metadata:
  name: reconcile
spec:
  # 스케줄로 실행하지 않는다.
  # (1) suspend (2) 2/31 실행
  suspend: true
  schedule: "0 0 31 2 *"
  timeZone: Asia/Seoul
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 0
      # 2시간이 넘으면 강제 종료
      activeDeadlineSeconds: 7200
      # 끝난 Job과 파드를 하루 뒤 자동 삭제
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          restartPolicy: Never
          containers:
          - name: reconcile
            image: dangubi-cronjob
            args:
            - --spring.batch.job.name=reconcileJob
            envFrom:
            - configMapRef:
                name: batch-config
            - secretRef:
                name: batch-db-cred
            env:
            - name: JAVA_TOOL_OPTIONS
              value: -XX:MaxRAMPercentage=75
            resources:
              requests:
                cpu: 500m
                memory: 1Gi
              limits:
                memory: 1Gi
