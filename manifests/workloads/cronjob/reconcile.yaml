# reconcile (CronJob) — 수동 실행 전용, suspend true
# - 역할: 배치 앱으로 reconcileJob을 실행한다 (예: MySQL과 MongoDB 읽기 모델 비교·보정). 스케줄로는 돌지 않는다.
# - 실행: kubectl -n dangubi create job --from=cronjob/reconcile reconcile-manual-$(date +%s)
#         (suspend 상태여도 --from으로는 실행된다. Argo CD 화면의 CronJob "Create Job" 액션도 같다)
# - 채울 것:
#   - suspend: true
#   - schedule: CronJob 필수 필드라 넣어야 한다. 오지 않는 날짜(예: "0 0 31 2 *", 2월 31일)로 두면
#     실수로 suspend를 풀어도 실행되지 않는다
#   - args --spring.batch.job.name=reconcileJob, Job 파라미터
#   - 이미지, envFrom(MongoDB도 쓰면 그 접속 정보), resources(quota 필수)
apiVersion: batch/v1
kind: CronJob
metadata:
  name: reconcile
