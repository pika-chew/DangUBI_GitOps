# batch-db-cred (ExternalSecret)
# - 역할: 배치 앱 작업들이 같이 쓰는 DB 계정을 Vault에서 가져온다. envFrom으로 읽으면 secretKey가 곧 환경 변수 이름이다.
# - 배치 앱은 SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD 환경 변수를 읽는다 (DangUBI_CronJob application.yaml).
# - Spring Batch 메타 테이블(BATCH_*)이 MySQL에 있어서, 이 계정에 그 테이블 권한도 필요하다 (MySQL 담당).
# - 채울 것: secretStoreRef(vault), target, data(Vault 경로·키), MongoDB를 쓰면 SPRING_DATA_MONGODB_URI
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: batch-db-cred
