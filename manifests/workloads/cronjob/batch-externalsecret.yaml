apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: batch-db-cred
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  refreshInterval: 1h
  target:
    name: batch-db-cred
    creationPolicy: Owner
  # CronJob들은 이 Secret을 envFrom으로 읽어서 secretKey(Secret의 키 이름)를 그대로 환경 변수 이름으로 쓴다.
  # (Collector는 Deployment의 secretKeyRef에서 환경 변수 이름을 직접 붙이므로 secretKey가 username이어도 된다)
  data:
    - secretKey: SPRING_DATASOURCE_USERNAME
      remoteRef:
        key: ubi/batch/mysql
        property: username
    - secretKey: SPRING_DATASOURCE_PASSWORD
      remoteRef:
        key: ubi/batch/mysql
        property: password
