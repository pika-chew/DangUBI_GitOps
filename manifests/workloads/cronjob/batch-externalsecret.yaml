# 배치 앱 작업들이 같이 쓰는 DB 계정. 각 CronJob이 envFrom으로 읽으므로 secretKey가 곧 환경 변수 이름이다.
# Collector·Debezium 계정과 분리한다. 작업별로 필요한 권한(쓰기·삭제 등)을 MySQL 담당과 정한다.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: batch-db-cred
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  refreshInterval: 1h
  target:
    name: batch-db-cred
    creationPolicy: Owner
  data:
    # TODO: Vault 경로와 키 이름을 Vault 담당과 맞춘다.
    - secretKey: SPRING_DATASOURCE_USERNAME
      remoteRef:
        key: CHANGE_ME
        property: username
    - secretKey: SPRING_DATASOURCE_PASSWORD
      remoteRef:
        key: CHANGE_ME
        property: password
    # TODO: MongoDB를 쓰는 작업이 있으면 SPRING_DATA_MONGODB_URI를 추가한다.
