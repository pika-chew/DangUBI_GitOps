# daily-pipeline: 매일 03:00. 배치 앱의 dailyPipelineJob을 실행한다.
# TODO: 이 작업이 하는 일 (예: 전날 수집 데이터로 점수·요약 계산)
apiVersion: batch/v1
kind: CronJob
metadata:
  name: daily-pipeline
  labels:
    app.kubernetes.io/name: daily-pipeline
    app.kubernetes.io/component: batch
    app.kubernetes.io/part-of: dangubi
spec:
  schedule: "0 3 * * *"
  timeZone: Asia/Seoul
  suspend: false
  # 이전 실행이 안 끝났으면 새로 시작하지 않는다 (같은 날짜를 두 번 처리하지 않게).
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # TODO: 실패 시 재시도 횟수. 배치가 재실행에 안전한지(멱등) 확인한 뒤 정한다.
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: daily-pipeline
            app.kubernetes.io/component: batch
        spec:
          restartPolicy: Never
          containers:
            - name: batch
              # kustomization.yaml의 images에서 실제 경로·태그로 바뀐다.
              image: dangubi-batch
              # TODO: 배치 앱이 job 이름을 받는 형식에 맞춘다 (예: --spring.batch.job.name=dailyPipelineJob).
              args: ["dailyPipelineJob"]
              envFrom:
                - configMapRef:
                    name: batch-config
                - secretRef:
                    name: batch-db-cred
              # 필수: dangubi 네임스페이스 ResourceQuota 때문에 requests·limits가 없으면 파드가 생성되지 않는다.
              resources:
                requests:
                  cpu: CHANGE_ME
                  memory: CHANGE_ME
                limits:
                  memory: CHANGE_ME
