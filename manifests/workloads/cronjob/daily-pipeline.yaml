# dailyJob: 어제(UTC) reconcile → 복사 대기 → ingest → score
# 직접 실행: kubectl -n dangubi create job --from=cronjob/daily-pipeline daily-pipeline-manual-$(date +%s)
apiVersion: batch/v1
kind: CronJob
metadata:
  name: daily-pipeline
spec:
  # KST 11:00
  schedule: "0 2 * * *"
  timeZone: Etc/UTC
  # 이전 실행이 아직 안 끝났으면 이번 실행은 건너뛴다. 같은 날짜 데이터를 두 번 처리하지 않게 한다.
  concurrencyPolicy: Forbid
  # 1h내로 재실행 가능
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # 재시도하면 reconcile 실패가 성공으로 가려진다. 수동 재실행하면 실패한 Step부터 이어서 처리한다.
      backoffLimit: 0
      # 2시간이 넘으면 강제 종료
      activeDeadlineSeconds: 7200
      # 끝난 Job과 파드를 1시간 뒤 자동 삭제
      ttlSecondsAfterFinished: 3600
      template:
        spec:
          # 실패한 파드를 그 자리에서 재시작하지 않고 남겨 둔다(로그 확인용).
          restartPolicy: Never
          containers:
          - name: daily-pipeline
            image: dangubi-cronjob
            args:
            - --spring.batch.job.name=dailyJob
            envFrom:
            - configMapRef:
                name: batch-config
            - secretRef:
                name: batch-db-cred
            - secretRef:
                name: batch-cloud-cred
            env:
            # JVM 힙을 메모리 limit의 75%로 맞춘다. 없으면 힙이 limit을 넘어 OOMKilled될 수 있다.
            - name: JAVA_TOOL_OPTIONS
              value: -XX:MaxRAMPercentage=75
            resources:
              requests:
                cpu: 500m
                memory: 1Gi
              limits:
                memory: 1Gi
