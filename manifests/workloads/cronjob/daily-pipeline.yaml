# daily-pipeline (CronJob) — 매일 03:00, suspend false
# - 역할: 매일 실제로 도는 묶음 작업. 배치 앱을 한 번 띄워 dailyPipelineJob을 실행한다.
# - 설계 의도: dailyPipelineJob = reconcileJob(정합성 검토) → ingestJob(적재) → scoreJob(점수 계산)을 순서대로 실행하고,
#   앞 단계가 실패하면 중단한다. 순서와 묶음은 배치 앱(Spring)이 보장하고, 이 CronJob은 다른 CronJob을 부르지 않는다.
#   (Spring에서 개별 Job 3개를 JobStep으로 묶으면 로직을 한 곳에만 두고 묶음·개별 실행에 같이 쓸 수 있다)
# - 지금 한 번 실행: kubectl -n dangubi create job --from=cronjob/daily-pipeline daily-pipeline-manual-$(date +%s)
# - 초안: kubectl create cronjob daily-pipeline --image=dangubi-batch --schedule="0 3 * * *" --restart=Never --dry-run=client -o yaml -- --spring.batch.job.name=dailyPipelineJob
#   - 생성 후 고칠 것: command → args (command는 이미지 실행 명령을 덮어쓴다), jobTemplate.metadata.name·status 삭제
# - 채울 것:
#   - schedule "0 3 * * *", timeZone Asia/Seoul, concurrencyPolicy Forbid(같은 날짜 중복 처리 방지), 재시도
#   - 이미지: kustomization images의 배치 앱 이미지
#   - args: --spring.batch.job.name=dailyPipelineJob (배치 앱이 이 형식으로 Job을 고른다)
#   - Job 파라미터: 같은 파라미터로 두 번 실행하면 Spring Batch가 거부한다.
#     매일 달라야 하므로 앱이 targetDate 기본값(어제)을 계산하거나 RunIdIncrementer를 쓴다
#   - envFrom batch-config, batch-db-cred / resources(quota 필수)
#   - jobTemplate의 ttlSecondsAfterFinished(끝난 Job 자동 삭제, --from으로 만든 수동 Job에도 복사된다)
apiVersion: batch/v1
kind: CronJob
metadata:
  name: daily-pipeline
spec:
  jobTemplate:
    metadata:
      name: daily-pipeline
    spec:
      template:
        metadata: {}
        spec:
          containers:
          - image: dangubi-batch
            name: daily-pipeline
            resources: {}
          restartPolicy: OnFailure
  schedule: 0 3 * * *
status: {}
