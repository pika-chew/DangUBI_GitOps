# outbox 정리 작업. Debezium이 binlog로 읽어 간 outbox 행은 다시 쓰이지 않으므로 주기적으로 지운다.
# 지워도 Kafka에는 영향이 없다 (Debezium tombstones.on.delete=false, Event Router는 DELETE를 무시).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: outbox-cleanup
  labels:
    app.kubernetes.io/name: outbox-cleanup
    app.kubernetes.io/part-of: dangubi
spec:
  # TODO: 실행 주기 (예: 매일 새벽 3시 "0 3 * * *"). 시간대는 timeZone으로 지정한다.
  schedule: CHANGE_ME
  timeZone: Asia/Seoul
  # 이전 실행이 안 끝났으면 새로 시작하지 않는다 (같은 행을 동시에 지우지 않게).
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # TODO: 실패 시 재시도 횟수
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: outbox-cleanup
        spec:
          restartPolicy: Never
          containers:
            - name: outbox-cleanup
              # TODO: 실행 이미지 (mysql 클라이언트 이미지 + SQL, 또는 Command 이미지의 정리 명령)
              image: CHANGE_ME
              # TODO: 실행 명령. 예: 보존 기간(N일)이 지난 outbox 행을 나눠서(batch) DELETE.
              #       Debezium이 아직 못 읽은 행을 지우지 않도록 보존 기간을 넉넉히 둔다.
              command: ["CHANGE_ME"]
              # TODO: MySQL 계정. Command 계정 Secret(command-mysql-cred)을 같이 쓸지, 정리 전용 계정을 둘지 정한다.
              #       다른 앱(command-api)이 만든 Secret에 기대면 그 앱이 먼저 떠 있어야 한다.
              # 필수: dangubi 네임스페이스 ResourceQuota 때문에 requests·limits가 없으면 Job 파드가 생성되지 않는다.
              resources:
                requests:
                  cpu: CHANGE_ME
                  memory: CHANGE_ME
                limits:
                  memory: CHANGE_ME
