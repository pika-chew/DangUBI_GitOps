# DB 스키마 초기화: Argo CD sync 직전(PreSync)마다 실행한다.
# DangUBI_CronJob의 db/trip-schema-mysql.sql을 배치 이미지 그대로 실행하므로,
# 새 이미지 태그로 CronJob이 바뀌기 전에 그 이미지의 스키마가 먼저 반영된다.
# 실패하면 sync가 멈추고 CronJob은 이전 상태로 남는다.
# 직접 실행이 필요하면 Argo CD에서 다시 sync한다.
apiVersion: batch/v1
kind: Job
metadata:
  name: db-init
  annotations:
    argocd.argoproj.io/hook: PreSync
    # 다음 sync 때 이전 Job을 지우고 새로 만든다. 그 전까지는 남겨서 로그를 볼 수 있다.
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 0
  # 10분이 넘으면 강제 종료 (DB 접속 대기로 sync가 계속 멈춰 있지 않게)
  activeDeadlineSeconds: 600
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets:
      - name: batch-ghcr-pull
      initContainers:
      # (1) Spring Batch 메타 테이블(BATCH_*). spring-batch-core의 스크립트는 IF NOT EXISTS가 없어
      #     두 번째 실행부터 "이미 있음" 오류가 나므로 오류를 무시하고 계속한다.
      - name: batch-schema
        image: dangubi-cronjob
        args:
        - --spring.batch.job.enabled=false
        - --spring.sql.init.mode=always
        - --spring.sql.init.schema-locations=classpath:org/springframework/batch/core/schema-mysql.sql
        - --spring.sql.init.continue-on-error=true
        envFrom:
        - configMapRef:
            name: batch-config
        - secretRef:
            name: batch-db-cred
        # 앱 Config의 빈 값 검사를 통과하려고 붙인다. 이 Job은 외부 저장소에 접근하지 않는다.
        - secretRef:
            name: batch-cloud-cred
        env:
        - name: JAVA_TOOL_OPTIONS
          value: -XX:MaxRAMPercentage=75
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            memory: 512Mi
      containers:
      # (2) 업무 테이블. 스크립트가 IF NOT EXISTS라 매번 실행해도 되고, 오류가 나면 Job을 실패시킨다.
      - name: trip-schema
        image: dangubi-cronjob
        args:
        - --spring.batch.job.enabled=false
        - --spring.sql.init.mode=always
        - --spring.sql.init.schema-locations=classpath:db/trip-schema-mysql.sql
        envFrom:
        - configMapRef:
            name: batch-config
        - secretRef:
            name: batch-db-cred
        - secretRef:
            name: batch-cloud-cred
        env:
        - name: JAVA_TOOL_OPTIONS
          value: -XX:MaxRAMPercentage=75
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            memory: 512Mi
