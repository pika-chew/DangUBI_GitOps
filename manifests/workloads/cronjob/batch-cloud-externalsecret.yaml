apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: batch-cloud-cred
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  refreshInterval: 1h
  target:
    name: batch-cloud-cred
    creationPolicy: Owner
  # CronJob들은 이 Secret을 envFrom으로 읽어서 secretKey(Secret의 키 이름)를 그대로 환경 변수 이름으로 쓴다.
  # 키와 시크릿은 한 쌍으로 교체하므로 같은 Vault 경로에 둔다.
  data:
    # AWS IAM 키 (S3 원본 버킷 읽기·SQS 재처리 큐 쓰기)
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: ubi/batch/aws
        property: access_key_id
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: ubi/batch/aws
        property: secret_access_key
    # Keystone EC2 credentials (Swift s3api 접근)
    - secretKey: SWIFT_ACCESS_KEY
      remoteRef:
        key: ubi/batch/swift
        property: access_key
    - secretKey: SWIFT_SECRET_KEY
      remoteRef:
        key: ubi/batch/swift
        property: secret_key
    - secretKey: SWIFT_ENDPOINT
      remoteRef:
        key: ubi/batch/swift
        property: endpoint
    - secretKey: SWIFT_CONTAINER
      remoteRef:
        key: ubi/batch/swift
        property: container
