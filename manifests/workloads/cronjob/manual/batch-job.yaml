# 테스트용 수동 Job 템플릿 (Argo CD 동기화 대상 아님 — ../kustomization.yaml resources에 없음)
# - 역할: 배치 앱 작업을 원하는 때에 한 번 실행한다. args만 바꿔 어떤 작업이든 돌린다.
#   CronJob과 다른 값(다른 이미지 태그, 다른 args·파라미터)으로 시험할 때 쓴다.
# - 보통은 이 파일 없이 CronJob 설정 그대로 실행하면 된다:
#     kubectl -n dangubi create job --from=cronjob/<이름> <이름>-manual-$(date +%s)
# - 이 파일로 실행: kubectl -n dangubi create -f manifests/workloads/cronjob/manual/batch-job.yaml
#   (generateName을 쓰면 apply가 아니라 create. 실행할 때마다 새 이름으로 만들어진다)
# - 채울 것: metadata.generateName, 수동 실행 표시 라벨, ttlSecondsAfterFinished(자동 삭제),
#           이미지(kustomize를 거치지 않으므로 실제 경로·태그), args --spring.batch.job.name=<작업>,
#           envFrom batch-config·batch-db-cred, resources(quota 필수)
apiVersion: batch/v1
kind: Job
metadata:
  generateName: batch-manual-
  namespace: dangubi
