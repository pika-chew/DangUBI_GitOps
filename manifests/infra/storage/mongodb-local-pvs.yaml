# MongoDB 멤버마다 별도 PV를 사용한다. 노드의 디렉터리는 적용 전에 준비한다.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: mongodb-local-worker-1
  labels:
    app.kubernetes.io/part-of: dangubi
    app.kubernetes.io/component: mongodb
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  capacity:
    storage: 20Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-mongodb
  local:
    path: /mnt/data/mongodb
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - k8s-worker-1
