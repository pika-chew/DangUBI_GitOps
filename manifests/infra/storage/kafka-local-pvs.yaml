# Kafka 브로커용 PV를 Worker마다 하나씩 둔다. 노드의 디렉터리는 적용 전에 준비한다.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: kafka-local-worker-2
  labels:
    app.kubernetes.io/part-of: dangubi
    app.kubernetes.io/component: kafka
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  capacity:
    storage: 10Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-kafka
  local:
    path: /mnt/data/kafka
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - k8s-worker-2
