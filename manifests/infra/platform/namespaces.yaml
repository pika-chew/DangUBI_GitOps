apiVersion: v1
kind: Namespace
metadata:
  name: dangubi
  labels:
    app.kubernetes.io/part-of: dangubi
  annotations:
    # Namespace 삭제로 내부 리소스가 함께 삭제되는 것을 방지한다.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
---
apiVersion: v1
kind: Namespace
metadata:
  name: dangubi-data
  labels:
    app.kubernetes.io/part-of: dangubi
  annotations:
    # DB와 PVC의 보존 정책이 Namespace 삭제로 우회되지 않도록 한다.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
---
# dangubi-connect (Namespace) — PSA enforce: privileged
# - 역할: Kafka Connect 워커·커넥터와 Strimzi 빌드 파드만 두는 네임스페이스.
# - 설계 의도: Strimzi 빌드 파드의 Buildah가 이미지 레이어를 풀 때 /를 다시 마운트(CAP_SYS_ADMIN)해야 해서
#   빌드 컨테이너가 privileged로 떠야 한다. Strimzi는 KafkaConnect와 같은 네임스페이스에서 빌드하므로,
#   DB가 있는 dangubi-data를 privileged로 올리는 대신 Connect만 이 네임스페이스로 옮겨 특권 범위를 좁힌다.
# - 초안: kubectl create namespace dangubi-connect --dry-run=client -o yaml
#   - 생성 후 고칠 것: status: {}, creationTimestamp: null 지우기
# - 채울 것:
#   - labels: app.kubernetes.io/part-of: dangubi (다른 Namespace와 같음)
#   - labels: pod-security.kubernetes.io/enforce: privileged (빌드 파드 생성 허용)
#   - labels: warn·audit은 baseline. 빌드 파드 말고 다른 특권 파드가 생기면 경고·감사 로그로 드러나게 한다.
#     (metallb-system·monitoring은 셋 다 privileged라 여기와 다르다)
#   - annotations: argocd.argoproj.io/sync-options: Prune=false,Delete=false (다른 Namespace와 같은 규칙)
apiVersion: v1
kind: Namespace
metadata:
  name: dangubi-connect
---
apiVersion: v1
kind: Namespace
metadata:
  name: metallb-system
  labels:
    app.kubernetes.io/part-of: dangubi
    # Speaker의 호스트 네트워크와 네트워크 권한을 허용한다.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
  annotations:
    # LoadBalancer Service가 사용하는 MetalLB의 Namespace를 보존한다.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
---
apiVersion: v1
kind: Namespace
metadata:
  name: argo-rollouts
  labels:
    app.kubernetes.io/part-of: dangubi
  annotations:
    # 배포 제어에 사용하는 컨트롤러의 Namespace를 보존한다.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
---
apiVersion: v1
kind: Namespace
metadata:
  name: external-secrets
  labels:
    app.kubernetes.io/part-of: dangubi
  annotations:
    # Secret 동기화 컨트롤러가 실행되는 네임스페이스를 보존한다.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    app.kubernetes.io/part-of: dangubi
    # Alloy DaemonSet이 노드 메트릭을 읽으려고 호스트의 /proc·/sys를 마운트한다.
    # pod 보안 등급을 privileged로 설정하여 Alloy가 호스트의 /proc·/sys를 읽을 수 있도록 한다.
    pod-security.kubernetes.io/enforce: privileged  # 위반 Pod 생성 거부
    pod-security.kubernetes.io/audit: privileged    # 위반 시 감사 로그 기록
    pod-security.kubernetes.io/warn: privileged     # 위반 시 kubectl 경고
  annotations:
    # 수집기 Namespace를 보존한다.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
---
apiVersion: v1
kind: Namespace
metadata:
  name: mysql-operator
  labels:
    app.kubernetes.io/part-of: dangubi
  annotations:
    # MySQL 클러스터를 관리하는 컨트롤러의 네임스페이스를 보존한다.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false

