apiVersion: v1
kind: Namespace
metadata:
  name: dangubi
  labels:
    app.kubernetes.io/part-of: dangubi
  annotations:
    # Namespace 삭제로 내부 리소스가 함께 삭제되는 것을 방지한다.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
---
apiVersion: v1
kind: Namespace
metadata:
  name: dangubi-data
  labels:
    app.kubernetes.io/part-of: dangubi
  annotations:
    # DB와 PVC의 보존 정책이 Namespace 삭제로 우회되지 않도록 한다.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
---
apiVersion: v1
kind: Namespace
metadata:
  name: metallb-system
  labels:
    app.kubernetes.io/part-of: dangubi
    # Speaker의 호스트 네트워크와 네트워크 권한을 허용한다.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
  annotations:
    # LoadBalancer Service가 사용하는 MetalLB의 Namespace를 보존한다.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
---
apiVersion: v1
kind: Namespace
metadata:
  name: argo-rollouts
  labels:
    app.kubernetes.io/part-of: dangubi
  annotations:
    # 배포 제어에 사용하는 컨트롤러의 Namespace를 보존한다.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
---
apiVersion: v1
kind: Namespace
metadata:
  name: external-secrets
  labels:
    app.kubernetes.io/part-of: dangubi
  annotations:
    # Secret 동기화 컨트롤러가 실행되는 네임스페이스를 보존한다.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    app.kubernetes.io/part-of: dangubi
    # Alloy DaemonSet이 노드 메트릭을 읽으려고 호스트의 /proc·/sys를 마운트한다.
    # pod 보안 등급을 privileged로 설정하여 Alloy가 호스트의 /proc·/sys를 읽을 수 있도록 한다.
    pod-security.kubernetes.io/enforce: privileged  # 위반 Pod 생성 거부
    pod-security.kubernetes.io/audit: privileged    # 위반 시 감사 로그 기록
    pod-security.kubernetes.io/warn: privileged     # 위반 시 kubectl 경고
  annotations:
    # 수집기 Namespace를 보존한다.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
---
apiVersion: v1
kind: Namespace
metadata:
  name: mysql-operator
  labels:
    app.kubernetes.io/part-of: dangubi
  annotations:
    # MySQL 클러스터를 관리하는 컨트롤러의 네임스페이스를 보존한다.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false

