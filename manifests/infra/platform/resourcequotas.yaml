# 모든 컨테이너에 CPU·메모리 requests와 메모리 limits를 지정해야 한다.
# 초기 한도이며 실제 chart·부하·장애 시 배치를 확인한 뒤 조정한다.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: dangubi-data-compute
  namespace: dangubi-data
  labels:
    app.kubernetes.io/part-of: dangubi
spec:
  hard:
    requests.cpu: "16"
    requests.memory: 40Gi
    limits.memory: 48Gi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: dangubi-workloads-compute
  namespace: dangubi
  labels:
    app.kubernetes.io/part-of: dangubi
spec:
  hard:
    requests.cpu: "8"
    requests.memory: 8Gi
    limits.memory: 12Gi
