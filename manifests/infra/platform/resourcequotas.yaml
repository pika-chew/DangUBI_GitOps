# 모든 컨테이너에 CPU·메모리 requests와 메모리 limits를 지정해야 한다.
# 초기 한도이며 실제 chart·부하·장애 시 배치를 확인한 뒤 조정한다.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: dangubi-data-compute
  namespace: dangubi-data
  labels:
    app.kubernetes.io/part-of: dangubi
spec:
  hard:
    requests.cpu: "16"
    requests.memory: 40Gi
    limits.memory: 48Gi
---
# 워커 2대 + 빌드 파드가 동시에 떠도 들어가고, 롤링 중 워커 1대가 더 겹칠 여유를 둔다.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: dangubi-connect-compute
  namespace: dangubi-connect
  labels:
    app.kubernetes.io/part-of: dangubi
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 6Gi
    limits.memory: 8Gi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: dangubi-workloads-compute
  namespace: dangubi
  labels:
    app.kubernetes.io/part-of: dangubi
spec:
  hard:
    requests.cpu: "8"
    requests.memory: 8Gi
    limits.memory: 12Gi
