# Ansible이 설치한 ClusterIP Service(argocd-server)는 그대로 두고,
# UI 접속용 LoadBalancer Service를 별도로 둔다.
# - 기존 Service는 Ansible이 server-side apply(--force-conflicts)로 관리하므로,
#   Argo CD가 같은 객체를 관리하면 재실행 때마다 필드 소유권을 두고 서로 덮어쓴다.
# - kubectl patch는 Git에 기록이 남지 않고, bootstrap/argocd 패치는 Argo CD 버전까지 바뀐다.
# - 분리하면 443만 노출할 수 있고, 이 Service만 지워도 내부 ClusterIP 접속에는 영향이 없다.
apiVersion: v1
kind: Service
metadata:
  name: argocd-server-lb
  namespace: argocd
  annotations:
    metallb.io/loadBalancerIPs: 172.16.10.201
spec:
  type: LoadBalancer
  # MetalLB L2는 VIP로 직접 받으므로 NodePort가 필요 없다. 모든 노드에 우회 경로가 열리지 않게 한다.
  allocateLoadBalancerNodePorts: false
  selector:
    app.kubernetes.io/name: argocd-server
  # HTTP 80은 노출하지 않는다. argocd-server는 8080에서 HTTPS·gRPC를 함께 처리한다.
  ports:
    - name: https
      protocol: TCP
      port: 443
      targetPort: 8080
