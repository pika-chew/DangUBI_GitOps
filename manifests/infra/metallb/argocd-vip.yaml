# Argo CD UI 전용 VIP. Neutron에서 같은 IP의 포트를 예약하고,
# Worker 4대의 포트에 허용 주소 쌍 172.16.10.100/32를 등록해야 트래픽이 전달된다.
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: argocd-vip
  namespace: metallb-system
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    # 최초 동기화의 dry-run 시점에는 CRD가 아직 없다.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  addresses:
    - 172.16.10.100/32
  # 다른 LoadBalancer Service가 이 VIP를 자동으로 가져가지 않게 한다.
  autoAssign: false
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: argocd-vip
  namespace: metallb-system
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  ipAddressPools:
    - argocd-vip
  interfaces:
    - ens3
  # 허용 주소 쌍을 등록한 Worker에서만 광고한다.
  nodeSelectors:
    - matchExpressions:
        - key: node-role.kubernetes.io/control-plane
          operator: DoesNotExist
