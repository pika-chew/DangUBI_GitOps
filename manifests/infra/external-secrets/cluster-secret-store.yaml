# 모든 ExternalSecret이 참조하는 Vault 접속 설정 (secretStoreRef: ClusterSecretStore/vault)
# ESO 컨트롤러가 자기 ServiceAccount 토큰으로 Vault kubernetes auth(role eso)에 로그인하고,
# 받은 Vault 토큰 하나로 모든 ExternalSecret의 키를 대신 읽는다. 읽을 수 있는 경로는 Vault policy(ubi/data/*)가 정한다.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault
  annotations:
    # chart의 CRD·Webhook 이후에 적용한다.
    argocd.argoproj.io/sync-wave: "1"
    # 최초 동기화의 dry-run 시점에는 CRD가 아직 없다.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  provider:
    vault:
      # 외부 Vault VM. 서버 인증서의 SAN에 이 IP가 있어야 TLS 검증을 통과한다.
      server: https://172.16.20.30:8200
      # KV 마운트 이름. ExternalSecret의 key가 ubi/...로 시작해도 ESO가 마운트를 한 번만 붙인다.
      path: ubi
      # KV v2라 실제 API 경로에 data/가 붙는다. 빠지면 읽기가 실패한다.
      version: v2
      # Vault VM의 /opt/vault/tls/vault-ca.crt (base64). 공개 인증서라 Git에 둔다. CA 개인키는 절대 올리지 않는다.
      caBundle: 
      auth:
        kubernetes:
          # vault auth enable kubernetes의 기본 경로
          mountPath: kubernetes
          # Vault의 auth/kubernetes/role/eso. 이 SA만 받아 주도록 묶여 있다.
          role: eso
          # 이 SA의 토큰으로 로그인한다. vault-tokenreview-rbac.yaml의 subjects와 같아야 한다.
          serviceAccountRef:
            name: dangubi-external-secrets
            namespace: external-secrets
