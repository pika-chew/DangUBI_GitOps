# K8s 오브젝트(Pod·Deployment·Job·HPA 등)의 상태를 메트릭으로 노출한다.
# 수집은 같은 네임스페이스의 Alloy가 Service를 scrape해 모니터링 VM Prometheus로 보낸다.
# collectors 등 나머지는 chart 기본값을 쓴다.

replicas: 1
# Pod가 죽으면 Deployment가 재시작한다.
# 2개로 늘리면 같은 메트릭이 두번 나와서 오히려 중복을 처리한다.
# chart 기본값도 1이다.


resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

# Prometheus Operator를 쓰지 않으므로 ServiceMonitor를 만들지 않는다(chart 기본값 false 유지).
# Prometheus Operator를 쓰지 않고 Alloy가 직접 Service를 찾아 scrape하므로 만들 필요가 없다.
prometheus:
  monitor:
    enabled: false
