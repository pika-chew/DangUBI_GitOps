# Strimzi 오퍼레이터(strimzi-kafka-operator chart 1.3.0) 설정값.
# apps/data/kafka.yaml이 $values/helm/kafka/values.yaml로 참조한다. 경로·파일명을 바꾸면 그쪽도 함께 바꿔야 한다.
#
# 이 파일은 "오퍼레이터 자체" 설정만 담는다.

# CRD(Kafka 같은 리소스 종류 등록서)
# - helm upgrade는 CRD를 갱신하지 않지만, Argo CD는 동기화할 때마다 CRD도 함께 적용한다.
# - 그래서 Strimzi 업그레이드는 apps/data/kafka.yaml의 targetRevision만 바꾸면 된다. (skipCrds는 켜지 않는다)


# 비워 두면 오퍼레이터가 설치된 네임스페이스(dangubi-data)만 감시한다.
watchNamespaces: []

# 클러스터 전체 감시는 모든 네임스페이스에 대한 권한이 필요해 범위가 너무 크다.
watchAnyNamespace: false

# CRD와 CR을 만들기 위한 설정 
createGlobalResources: true

# 오퍼레이터가 죽어도 이미 떠 있는 Kafka·Connect는 계속 동작한다. 설정 변경 반영(재조정)만 잠시 멈추므로 1대로 충분하다.
replicas: 1

resources:
  requests:
    # 요청량 최소
    cpu: 100m
    memory: 384Mi
  limits:
    memory: 512Mi
    # CPU 상한은 두지 않는다(스로틀링 방지).
    # chart 기본값에 cpu: 1000m이 있어 null로 명시해 지운다.
    cpu: null

# 평소에는 INFO. 문제를 분석할 때만 DEBUG로 올린다.
logLevel: INFO

# 기본값 유지: Kafka 리스너용 NetworkPolicy를 오퍼레이터가 자동으로 만든다.
generateNetworkPolicy: true

dashboards:
  # 기본값 유지: Grafana 대시보드 ConfigMap은 observability 담당과 합의한 뒤 켠다.
  enabled: false
