# Strimzi 오퍼레이터(strimzi-kafka-operator chart 1.3.0) 설정값.
# apps/data/kafka.yaml이 $values/helm/kafka/values.yaml로 참조한다. 경로·파일명을 바꾸면 그쪽도 함께 바꿔야 한다.
#
# 이 파일은 "오퍼레이터 자체" 설정만 담는다.
# 브로커 수, 보존 기간 같은 Kafka 설정은 manifests/data/kafka/kafka.yaml(Kafka CR)에 있다.
#
# CRD 관리
# - Strimzi chart는 CRD를 crds/ 폴더로 배포한다. Helm CLI(helm upgrade)는 업그레이드 때 crds/를 갱신하지 않지만,
#   Argo CD는 chart를 렌더링해 동기화할 때마다 CRD도 함께 적용한다.
# - 따라서 Strimzi 버전 업그레이드는 apps/data/kafka.yaml의 targetRevision만 바꾸면 CRD까지 같이 올라간다.
# - 그래서 skipCrds 같은 CRD 생략 옵션은 설정하지 않는다.

# 비워 두면 오퍼레이터가 설치된 네임스페이스(dangubi-data)만 감시한다. Kafka·Connect가 모두 이 네임스페이스에 있다.
watchNamespaces: []

# 클러스터 전체 감시는 모든 네임스페이스에 대한 권한이 필요해 범위가 너무 크다.
watchAnyNamespace: false

# CRD와 ClusterRole을 만들려면 켜 둬야 한다. 끄면 Kafka CR을 인식할 수 없다.
createGlobalResources: true

# 오퍼레이터가 죽어도 이미 떠 있는 Kafka·Connect는 계속 동작한다. 설정 변경 반영(재조정)만 잠시 멈추므로 1대로 충분하다.
replicas: 1

resources:
  requests:
    # 하이퍼컨버지드 환경(노트북 워커 2C/8GB 포함)이라 요청량을 최소로 잡는다.
    cpu: 100m
    memory: 384Mi
  limits:
    memory: 512Mi
    # CPU 상한은 두지 않는다(스로틀링 방지).
    # chart 기본값에 cpu: 1000m이 있어 키를 빼기만 하면 기본값이 그대로 합쳐지므로, null로 명시해 지운다.
    cpu: null

# 평소에는 INFO. 문제를 분석할 때만 DEBUG로 올린다.
logLevel: INFO

# 기본값 유지: Kafka 리스너용 NetworkPolicy를 오퍼레이터가 자동으로 만든다.
generateNetworkPolicy: true

dashboards:
  # 기본값 유지: Grafana 대시보드 ConfigMap은 observability 담당과 합의한 뒤 켠다.
  enabled: false
