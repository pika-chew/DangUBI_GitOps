apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: dangubi-data
  namespace: argocd
spec:
  description: MySQL, MongoDB, Kafka와 Kafka Connect 배포
  sourceRepos:
    - https://github.com/pika-chew/DangUBI_GitOps.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: dangubi-data
  clusterResourceWhitelist: []
  namespaceResourceBlacklist:
    - group: ""
      kind: ResourceQuota
    - group: ""
      kind: LimitRange
    - group: argoproj.io
      kind: Application
    - group: argoproj.io
      kind: ApplicationSet
    - group: argoproj.io
      kind: AppProject
