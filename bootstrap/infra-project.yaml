apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: dangubi-infra
  namespace: argocd
spec:
  description: DangUBI 네임스페이스, 스토리지, 네트워크와 플랫폼 컨트롤러 관리
  sourceRepos:
    # 외부 chart를 도입할 때 해당 저장소 URL을 추가한다.
    - https://github.com/pika-chew/DangUBI_GitOps.git
    - https://kubernetes.github.io/cloud-provider-openstack
    - https://metallb.github.io/metallb
    - https://charts.external-secrets.io
    - https://argoproj.github.io/argo-helm
    - https://mysql.github.io/mysql-operator/
    - https://percona.github.io/percona-helm-charts/
  destinations:
    - server: https://kubernetes.default.svc
      namespace: kube-system
    - server: https://kubernetes.default.svc
      namespace: metallb-system
    - server: https://kubernetes.default.svc
      namespace: argo-rollouts
    - server: https://kubernetes.default.svc
      namespace: external-secrets
    - server: https://kubernetes.default.svc
      namespace: mysql-operator
    - server: https://kubernetes.default.svc
      namespace: dangubi-data
    - server: https://kubernetes.default.svc
      namespace: dangubi
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: ""
      kind: PersistentVolume
    - group: storage.k8s.io
      kind: StorageClass
    - group: storage.k8s.io
      kind: CSIDriver
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
  namespaceResourceBlacklist:
    - group: argoproj.io
      kind: Application
    - group: argoproj.io
      kind: ApplicationSet
    - group: argoproj.io
      kind: AppProject
